<div class="row" style="background: #e1f5fe; padding: 10px; border: 1px solid #01579b; gap:5px; border-radius: 8px; margin-top: 10px; flex-wrap: wrap;">
    <div style="font-weight: bold; width: 100%; margin-bottom: 5px; color: #01579b;">GCS 快速評估</div>
    <select id="gcs-e" onchange="autoUpdate()" style="flex:1; min-width: 120px;">
        <option value="4">E4 (Spontaneous)</option>
        <option value="3">E3 (To verbal)</option>
        <option value="2">E2 (To pain)</option>
        <option value="1">E1 (None)</option>
        <option value="NT">E NT (Not testable)</option>
    </select>
    <select id="gcs-v" onchange="autoUpdate()" style="flex:1; min-width: 120px;">
        <option value="5">V5 (Oriented)</option>
        <option value="4">V4 (Confused)</option>
        <option value="3">V3 (Inappropriate)</option>
        <option value="2">V2 (Incomprehensible)</option>
        <option value="1">V1 (None)</option>
        <option value="NT">V NT (Intubated)</option>
    </select>
    <select id="gcs-m" onchange="autoUpdate()" style="flex:1; min-width: 120px;">
        <option value="6">M6 (Obeys)</option>
        <option value="5">M5 (Localizes)</option>
        <option value="4">M4 (Withdrawal)</option>
        <option value="3">M3 (Flexion)</option>
        <option value="2">M2 (Extension)</option>
        <option value="1">M1 (None)</option>
        <option value="NT">M NT (Not testable)</option>
    </select>
</div>

<div id="localization-display" style="margin-top: 15px; padding: 15px; background: #fff3e0; border-left: 5px solid #ff9800; font-family: sans-serif;">
    <strong style="color: #e65100;">[Initial Localization Guide]</strong>
    <div id="loc-content" style="margin-top: 5px; font-size: 0.9rem; line-height: 1.4;">尚無足夠資訊進行定位</div>
</div>

<script>
// --- 修改 generateText 函式內容 ---
function generateText() {
    const id = document.getElementById('v-id').value;
    
    // 1. GCS 邏輯
    const e = document.getElementById('gcs-e').value;
    const v = document.getElementById('gcs-v').value;
    const m = document.getElementById('gcs-m').value;
    let gcsTotal = (e === 'NT' || v === 'NT' || m === 'NT') ? 'NT' : (parseInt(e) + parseInt(v) + parseInt(m));
    const gcsLine = `GCS: E${e}V${v}M${m}, Total: ${gcsTotal}`;

    // (中間原本獲取各種資料的 getCN, getMP, nVals, mmseVals 邏輯保持完全不變...)
    // ... 假設這裡延續你原本的變數定義 ...

    // 2. Localization 邏輯推論
    let locHints = [];
    const nVals = Array.from(document.querySelectorAll('.n-val')).map(el => el.value);
    const nTotal = nVals.reduce((a,b)=>a+parseInt(b),0);
    
    // Rule L1: Cortical signs
    if (parseInt(nVals[12]) > 0 || parseInt(nVals[14]) > 0) { // NIHSS 9 (Language) or 11 (Neglect)
        locHints.push("Cortical signs present (Aphasia/Neglect).");
    }

    // Rule L2: UMN pattern
    const babinski = document.getElementById('v-ref-path').value.toLowerCase();
    const muscleTone = document.getElementById('v-motor-tone').value.toLowerCase();
    if (babinski.includes('+/+') && (muscleTone.includes('spastic') || muscleTone.includes('rigid'))) {
        locHints.push("Upper Motor Neuron (UMN) lesion pattern detected.");
    }

    // Rule L3: Hemiparesis distribution
    const mpR = document.querySelectorAll('.mp-r'), mpL = document.querySelectorAll('.mp-l');
    const isWeakR = (Array.from(mpR).some(el => el.value < 5));
    const isWeakL = (Array.from(mpL).some(el => el.value < 5));
    if (isWeakR || isWeakL) {
        locHints.push(isWeakR ? "Right-sided Hemiparesis." : "Left-sided Hemiparesis.");
        
        // Lacunar vs Cortical check (均勻度)
        if (nVals[5] === nVals[7] && nVals[7] === nVals[8]) { // Face/Arm/Leg NIHSS 一致
             locHints.push("Symmetric weakness distribution: Lacunar syndrome suspected.");
        }
    }

    // Rule: Crossed Signs (CN vs Motor)
    // 簡單判定：CN 有選 '+' 且對側肢體無力
    const hasRightCN = Array.from(document.querySelectorAll('.cn-input')).some(el => el.value === '+' && el.closest('.sub-row').innerText.includes('R'));
    const hasLeftCN = Array.from(document.querySelectorAll('.cn-input')).some(el => el.value === '+' && el.closest('.sub-row').innerText.includes('L'));
    if ((hasLeftCN && isWeakR) || (hasRightCN && isWeakL)) {
        locHints.push("Crossed Signs detected: Suspect Brainstem lesion (Crossed hemiplegia).");
    }

    // Rule: Myelopathy Level
    const sensoryPin = document.getElementById('s-pin').value;
    if (sensoryPin.toLowerCase().includes('t')) {
        locHints.push(`Suspect spinal cord lesion at ${sensoryPin.toUpperCase()} level.`);
    }

    // 更新 Localization UI
    document.getElementById('loc-content').innerHTML = locHints.length > 0 ? 
        `<ul>${locHints.map(h => `<li>${h}</li>`).join('')}</ul>` : "根據目前數值尚未發現明顯定位特徵。";

    // 3. 組合 Note (將 GCS 放在最上方)
    let t = `【Neurological examination】\n`;
    t += `${gcsLine}\n`; // GCS 置頂
    t += `. Consciousness: ${document.querySelectorAll('.n-val')[0].options[document.querySelectorAll('.n-val')[0].selectedIndex].text.split(' ')[1] || 'clear'}\n\n`;

    // ... (後續原本的 *Cranial nerve, *Motor, *Reflex, *Sensation, *UPDRS, *Mental Status, NIHSS 組合邏輯完全不變) ...
    // ...
    
    document.getElementById('export-area').value = t;
}
</script>
