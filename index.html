<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笨腦子記不住NE</title>
    <style>
        body { font-family: 'Droid Sans', sans-serif; background: #ffffff; color: #222; margin: 0; padding-bottom: 120px; }
        .header { background: #f4f4f4; padding: 10px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #ddd; }
        .menu { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .menu button { padding: 10px 14px; font-size: 15px; border: 1px solid #ccc; background: white; border-radius: 6px; }
        .menu button.active { background: #888; color: white; border-color: #888; }
        
        .container { padding: 15px; max-width: 650px; margin: auto; }
        .section-title { font-weight: bold; font-size: 1.5rem; border-left: 6px solid #888; padding-left: 12px; margin: 25px 0 15px; }
        
        /* 每一列的通用樣式 */
        .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px solid #eee; }
        .q-label { font-size: 1.1rem; font-weight: 600; flex: 1; padding-right: 10px; } /* 加大字體並靠左 */
        select { font-size: 1.1rem; padding: 6px; border-radius: 5px; border: 1px solid #bbb; background: #fff; min-width: 80px; }
        
        /* NIHSS 特殊顏色分段 */
        .bg-white { background-color: #ffffff; }
        .bg-grey { background-color: #f7f7f7; }

        /* MP 專用樣式 */
        .mp-group { border-bottom: 2px solid #ddd; margin-bottom: 15px; padding-bottom: 5px; }
        .mp-subtext { font-size: 0.9rem; color: #666; font-weight: normal; }

        .footer-bar { position: fixed; bottom: 0; width: 100%; background: #fff; border-top: 3px solid #888; padding: 15px; text-align: center; box-shadow: 0 -3px 10px rgba(0,0,0,0.1); }
        #score-display { font-weight: bold; font-size: 1.2rem; display: block; margin-bottom: 10px; color: #000; }
        .save-btn { background: #444; color: white; border: none; padding: 12px 30px; border-radius: 30px; font-size: 16px; cursor: pointer; }
        
        .hidden { display: none; }
        @media print { .header, .footer-bar { display: none; } .hidden { display: block !important; } }
    </style>
</head>
<body>

<div class="header">
    <div class="menu">
        <button onclick="show('nihss')" id="b-nihss">NIHSS</button>
        <button onclick="show('updrs')" id="b-updrs">UPDRS</button>
        <button onclick="show('mmse')" id="b-mmse">MMSE</button>
        <button onclick="show('mp')" id="b-mp">MP</button>
        <button onclick="show('dtr')" id="b-dtr">DTR</button>
        <button onclick="show('joint')" id="b-joint">Joint</button>
        <button onclick="show('vibe')" id="b-vibe">Vibe</button>
    </div>
</div>

<div class="container">
    <div id="s-nihss" class="sec">
        <div class="section-title">NIHSS 腦中風評估</div>
        <div id="nihss-box"></div>
    </div>

    <div id="s-updrs" class="sec hidden">
        <div class="section-title">UPDRS Part III</div>
        <div id="updrs-box"></div>
    </div>

    <div id="s-mmse" class="sec hidden">
        <div class="section-title">MMSE 智能測驗</div>
        <div id="mmse-box"></div>
    </div>

    <div id="s-mp" class="sec hidden">
        <div class="section-title">Muscle Power Strength</div>
        <div id="mp-box"></div>
    </div>

    <div id="s-dtr" class="sec hidden"><div class="section-title">DTR (R/L)</div><div id="dtr-box"></div></div>
    <div id="s-joint" class="sec hidden"><div class="section-title">Joint Position</div><div id="joint-box"></div></div>
    <div id="s-vibe" class="sec hidden"><div class="section-title">Vibration (R/L)</div><div id="vibe-box"></div></div>
</div>

<div class="footer-bar">
    <span id="score-display">請開始評分</span>
    <button class="save-btn" onclick="window.print()">儲存結果 (PDF/截圖)</button>
</div>

<script>
const nihssQ = [
    {n:"1a 意識程度", opts:[0,1,2,3]}, {n:"1b 意識詢問", opts:[0,1,2]}, {n:"1c 執行命令", opts:[0,1,2]}, // 1-3
    {n:"2 眼球運動", opts:[0,1,2]}, {n:"3 視野", opts:[0,1,2,3]}, {n:"4 面部肌肉", opts:[0,1,2,3]}, // 4-6
    {n:"5a 左上肢", opts:[0,1,2,3,4]}, {n:"5b 右上肢", opts:[0,1,2,3,4]}, {n:"6a 左下肢", opts:[0,1,2,3,4]}, {n:"6b 右下肢", opts:[0,1,2,3,4]}, // 7-10
    {n:"7 肢體失調", opts:[0,1,2]}, {n:"8 感覺功能", opts:[0,1,2]}, {n:"9 語言功能", opts:[0,1,2,3]}, {n:"10 構音困難", opts:[0,1,2]}, {n:"11 忽略症", opts:[0,1,2]} // 11-15
];

const mmseQ = ["今年是哪一年？", "現在是什麼季節？", "今天是幾號？", "今天是禮拜幾？", "現在是哪個月？", "省/市名稱？", "縣/市名稱？", "區/鄉鎮名稱？", "機構/醫院名稱？", "現在在幾樓？", "複述：藍色", "複述：悲傷", "複述：火車", "100-7=93", "再減7=86", "再減7=79", "再減7=72", "再減7=65", "回憶：藍色", "回憶：悲傷", "回憶：火車", "辨識：手錶", "辨識：鉛筆", "唸一句：白紙真正寫黑字", "指令：請閉上眼睛", "指令：拿紙", "指令：折半", "指令：放大腿", "寫一個完整句子", "畫出交叉五邊形"];

const mpItems = [
    {n:"Neck Flexion", root:""}, {n:"Neck Extension", root:""},
    {n:"Shoulder Abduction", root:"C5"}, {n:"Elbow Flexion", root:"C6"},
    {n:"Elbow Extension", root:"C7"}, {n:"Wrist Flexion", root:"C7"},
    {n:"Wrist Extension", root:"C6"}, {n:"Finger Flexion", root:"C8"},
    {n:"Finger Extension", root:"C7"}, {n:"Grasping", root:"C8/T1"},
    {n:"Finger Abduction", root:"T1"}, {n:"Finger Adduction", root:"T1"},
    {n:"Hip Flexion", root:"L2"}, {n:"Knee Flexion", root:"S2"},
    {n:"Knee Extension", root:"L3"}, {n:"Ankle Dorsiflexion", root:"L4"},
    {n:"Ankle Plantarflexion", root:"S1"}, {n:"Big Toe Extension", root:"L5"}
];

function init() {
    // NIHSS with color segments
    const nBox = document.getElementById('nihss-box');
    nihssQ.forEach((q, i) => {
        let colorClass = (i < 3) ? "bg-white" : (i < 6) ? "bg-grey" : (i < 10) ? "bg-white" : "bg-grey";
        nBox.innerHTML += `<div class="row ${colorClass}"><span class="q-label">${q.n}</span><select class="n-val" onchange="calcN()">${q.opts.map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div>`;
    });

    // MMSE
    const mBox = document.getElementById('mmse-box');
    mmseQ.forEach((q, i) => {
        mBox.innerHTML += `<div class="row"><span class="q-label">${i+1}. ${q}</span><select class="m-val" onchange="calcM()"><option value="0">0</option><option value="1">1</option></select></div>`;
    });

    // MP (Muscle Power)
    const mpBox = document.getElementById('mp-box');
    mpItems.forEach(it => {
        mpBox.innerHTML += `<div class="row mp-group"><span class="q-label">${it.n} <span class="mp-subtext">${it.root?'('+it.root+')':''}</span></span><div>R:<select>${[5,4,3,2,1,0].map(v=>`<option>${v}</option>`).join('')}</select> L:<select>${[5,4,3,2,1,0].map(v=>`<option>${v}</option>`).join('')}</select></div></div>`;
    });

    // Vibration Scroll (0.0 - 8.0)
    const vBox = document.getElementById('vibe-box');
    const vOpts = []; for(let i=80; i>=0; i--) vOpts.push((i/10).toFixed(1));
    ["Big Toe", "Finger", "Ankle"].forEach(it => {
        vBox.innerHTML += `<div class="row"><span class="q-label">${it} (R/L)</span><div><select>${vOpts.map(v=>`<option ${v=='8.0'?'selected':''}>${v}</option>`).join('')}</select> / <select>${vOpts.map(v=>`<option ${v=='8.0'?'selected':''}>${v}</option>`).join('')}</select></div></div>`;
    });

    // UPDRS
    const uBox = document.getElementById('updrs-box');
    const updrsData = [ {id:18,n:"語言"}, {id:19,n:"面部表情"}, {id:20,n:"靜止型顫抖"}, {id:21,n:"動作/姿勢顫抖"}, {id:22,n:"僵硬"}, {id:23,n:"手指打拍"}, {id:24,n:"手掌握合"}, {id:25,n:"前臂迴旋"}, {id:26,n:"腳靈敏度"}, {id:27,n:"椅上站起"}, {id:28,n:"姿勢"}, {id:29,n:"步態"}, {id:30,n:"姿勢平穩"}, {id:31,n:"動作遲緩"} ];
    updrsData.forEach(q => {
        uBox.innerHTML += `<div class="row"><span class="q-label">${q.id}. ${q.n}</span><select class="u-val" onchange="calcU()">${[0,1,2,3,4].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div>`;
    });

    // DTR & Joint
    const dBox = document.getElementById('dtr-box');
    ["Biceps", "Triceps", "Brachioradialis", "Knee", "Ankle"].forEach(it => {
        dBox.innerHTML += `<div class="row"><span class="q-label">${it}</span><div><select>${["++","+++","++++","+","-","mute"].map(v=>`<option>${v}</option>`).join('')}</select> <label><input type="checkbox">Ref</label></div></div>`;
    });
    const jBox = document.getElementById('joint-box');
    ["Fingers R","Fingers L","Toes R","Toes L"].forEach(it=>{
        jBox.innerHTML += `<div class="row"><span class="q-label">${it}</span><select>${[5,4,3,2,1,0].map(v=>`<option>${v}</option>`).join('')}</select></div>`;
    });
}

function show(id) {
    document.querySelectorAll('.sec').forEach(s=>s.classList.add('hidden'));
    document.getElementById('s-'+id).classList.remove('hidden');
    document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
    document.getElementById('b-'+id).classList.add('active');
    updateScore(id);
}

function updateScore(id) {
    if(id==='nihss') calcN();
    else if(id==='updrs') calcU();
    else if(id==='mmse') calcM();
    else document.getElementById('score-display').innerText = "臨床數據紀錄模式";
}

function calcN() {
    const vals = Array.from(document.querySelectorAll('.n-val')).map(s=>s.value);
    const total = vals.reduce((a,b)=>a+parseInt(b), 0);
    const s1 = vals.slice(0,3).join('');
    const s2 = vals.slice(3,6).join('');
    const s3 = vals.slice(6,10).join('');
    const s4 = vals.slice(10,15).join('');
    document.getElementById('score-display').innerText = `NIHSS = ${total} (${s1} ${s2} ${s3} ${s4})`;
}

function calcM() {
    const total = Array.from(document.querySelectorAll('.m-val')).reduce((a,b)=>a+parseInt(b.value), 0);
    document.getElementById('score-display').innerText = `MMSE = ${total} / 30`;
}

function calcU() {
    const total = Array.from(document.querySelectorAll('.u-val')).reduce((a,b)=>a+parseInt(b.value), 0);
    document.getElementById('score-display').innerText = `UPDRS Total: ${total}`;
}

init(); show('nihss');
</script>
</body>
</html>
